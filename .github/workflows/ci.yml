name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: embi
          POSTGRES_PASSWORD: embi
          POSTGRES_DB: embi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U embi -d embi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://embi:embi@localhost:5432/embi
      TEST_DATABASE_URL: postgresql://embi:embi@localhost:5432/embi_test
      AWS_S3_BUCKET: embi-print-test
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install OS deps for convert pipeline
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick potrace

      - name: Install Python deps
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Create test DB
        run: |
          PGPASSWORD=embi psql -h localhost -U embi -d embi -c "CREATE DATABASE embi_test;"

      - name: Alembic upgrade head
        working-directory: backend
        run: alembic upgrade head

      - name: Pytest
        working-directory: backend
        run: pytest -v

      - name: Ruff
        working-directory: backend
        run: ruff check .

      - name: Mypy
        working-directory: backend
        # Narrow target: pure-logic modules. Routers are thin SQLA wrappers
        # that produce noisy false positives without the SQLA mypy plugin
        # (deprecated in SQLA 2.0). Re-widen once models adopt Mapped[].
        run: mypy services dst.py storage.py schemas.py ratelimit.py --ignore-missing-imports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      # Build-time only — never the live key. Real key lives in Railway env.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
